{% extends "instruction_base.html" %}
{% load static %}

{% block head %}
<style>
html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
}
.container {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}
.content {
    flex: 0 1 auto;
}
.video-viewer-container {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.video-viewer-container > .col {
    position: relative;
    height: 100%;
}
#instruction-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
.enable-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.45);
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-center content">
        <h1>Page {{ current_page }}</h1>
    </div>
    <div class="row my-3 content">
        <div class="col text-start">
            <button id="prev-btn" class="btn btn-primary" {% if current_page <= 1 %}disabled{% endif %}>
                &larr; Previous
            </button>
        </div>
        <div class="col text-center d-flex justify-content-center align-items-center gap-2 flex-wrap">
            <button id="play-btn" type="button" class="btn btn-secondary">Play</button>
            <button id="pause-btn" type="button" class="btn btn-secondary">Pause</button>
            <span id="video-ready-count">Ready for Video: 0/0</span>
        </div>
        <div class="col text-end">
            <button id="next-btn" class="btn btn-primary" {% if current_page >= total_pages %}disabled{% endif %}>
                Next &rarr;
            </button>
        </div>
    </div>
    <div class="row my-3 content">
        <div class="col text-end">
            <button id="end-instructions-btn" class="btn btn-danger">End Instructions</button>
        </div>
    </div>
    <div class="row video-viewer-container">
        <div class="col">
            <video id="instruction-video" src="{{ current_file }}" preload="auto" playsinline></video>
            <div id="enable-video" class="enable-overlay">
                <button type="button" class="btn btn-primary btn-lg" id="enable-video-btn">Click to enable video</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block tail %}
<script>
    const sessionId = "{{ session_id }}";
    const ws_scheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${ws_scheme}://${window.location.host}/ws/instructions/${sessionId}/`);
    const video = document.getElementById('instruction-video');
    const enableOverlay = document.getElementById('enable-video');
    let videoEnabled = false;
    let pendingCommand = null;
    let startTimer = null;

    function autoplayWithSoundAllowed() {
        try {
            if (typeof navigator.getAutoplayPolicy !== 'function') {
                return false;
            }
            return navigator.getAutoplayPolicy(video) === 'allowed';
        } catch (err) {
            return false;
        }
    }

    if (autoplayWithSoundAllowed()) {
        videoEnabled = true;
        enableOverlay.hidden = true;
    }

    socket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        if (data.type === 'update_page') {
            window.location.reload();
        } else if (data.type === 'video_enabled') {
            document.getElementById('video-ready-count').textContent =
                `Ready for Video: ${data.enabled}/${data.total}`;
        } else if (data.type === 'media_command') {
            applyMediaCommand(data);
        } else if (data.type === 'end_instructions') {
            const staffUrl = data.staff_complete_url;
            if (staffUrl) {
                window.location.href = staffUrl;
            } else {
                window.close();
            }
        } else if (data.type === 'end_instructions_failed') {
            const end_button = document.getElementById('end-instructions-btn');
            end_button.disabled = false;
            end_button.innerText = 'End Instructions';
        }
    };

    function applyMediaCommand(msg) {
        if (!videoEnabled) {
            pendingCommand = msg;
            return;
        }
        if (startTimer !== null) {
            clearTimeout(startTimer);
            startTimer = null;
        }
        if (msg.command === 'pause') {
            video.pause();
            if (typeof msg.position === 'number' && Number.isFinite(msg.position)) {
                video.currentTime = msg.position;
            }
            return;
        }
        const serverTimeMs = msg.server_time * 1000;
        const offset = Date.now() - serverTimeMs;
        const playAtLocal = msg.play_at * 1000 + offset;
        const start = () => {
            startTimer = null;
            const late = Math.max(0, (Date.now() - playAtLocal) / 1000);
            const target = (msg.position || 0) + late;
            const seekAndPlay = () => {
                video.currentTime = target;
                video.play().catch((err) => console.error('Playback failed', err));
            };
            if (video.readyState >= 1) {
                seekAndPlay();
            } else {
                video.addEventListener('loadedmetadata', seekAndPlay, { once: true });
            }
        };
        const wait = playAtLocal - Date.now();
        if (wait > 20) {
            startTimer = setTimeout(start, wait);
        } else {
            start();
        }
    }

    document.getElementById('enable-video-btn').addEventListener('click', async () => {
        enableOverlay.hidden = true;
        try {
            await video.play();
            video.pause();
        } catch (err) {
            console.error('Could not enable video', err);
        }
        videoEnabled = true;
        const command = pendingCommand;
        pendingCommand = null;
        if (command) {
            applyMediaCommand(command);
        } else {
            video.currentTime = 0;
        }
    });

    document.getElementById('prev-btn').addEventListener('click', function() {
        socket.send(JSON.stringify({ action: 'previous_page' }));
    });

    document.getElementById('next-btn').addEventListener('click', function() {
        socket.send(JSON.stringify({ action: 'next_page' }));
    });

    document.getElementById('play-btn').addEventListener('click', function() {
        socket.send(JSON.stringify({ action: 'play_media' }));
    });

    document.getElementById('pause-btn').addEventListener('click', function() {
        socket.send(JSON.stringify({ action: 'pause_media' }));
    });

    const end_button = document.getElementById('end-instructions-btn');
    end_button.addEventListener('click', function() {
        end_button.disabled = true;
        end_button.innerText = 'Processing...';
        socket.send(JSON.stringify({ action: 'end_instructions' }));
    });
</script>
{% endblock %}
